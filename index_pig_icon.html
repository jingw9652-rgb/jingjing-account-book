<style>
:root{color-scheme:light;--bg:#F2F2F7;--card:#fff;--ink:#000;--mute:#8E8E93;--line:#E5E5EA;--out:#FF3B30;--in:#248A3D;--acc:#007AFF;--accInk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:16px 16px 110px}
.mon{display:flex;align-items:center;justify-content:space-between;color:var(--mute)}
.mon button{background:none;border:0;color:var(--ink);font-size:24px;padding:4px 12px;cursor:pointer}
.mon b{color:var(--ink);font-weight:600}
.bal{padding:20px 4px 18px;border-bottom:1px solid var(--line)}
.bal small{color:var(--mute)}
.bal .n{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.15}
.sub{display:flex;gap:28px;margin-top:6px;color:var(--mute)}
.sub b{color:var(--ink);font-weight:600}
.day{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:20px 4px 6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-bottom:1px solid var(--line)}
.row:first-of-type{border-radius:12px 12px 0 0}.row:last-child{border-bottom:0;border-radius:0 0 12px 12px}.row:only-child{border-radius:12px}
.row .c{flex:1;min-width:0}.row .c span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:600}.out{color:var(--out)}.in{color:var(--in)}
.row .x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 6px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:56px 0}
.add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accInk);border:0;border-radius:28px;padding:14px 36px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:8px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
#amt{width:100%;border:0;border-bottom:2px solid var(--line);background:none;color:var(--ink);font-size:36px;font-weight:700;padding:4px 0;outline:0}
#amt:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:6px 14px;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.f{display:flex;gap:8px}
.f input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font-size:15px}
#err{color:var(--out);font-size:13px;min-height:20px;margin:6px 0 0}
.ok{width:100%;margin-top:6px;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer}
.tabs{margin-bottom:10px}
.mh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font-weight:600}
.mh .seg{margin:0;width:150px}
.mbar{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:16px 14px;margin-bottom:8px;cursor:pointer}
.mbar>span:first-child{width:34px;color:var(--mute)}
.mbar .t{flex:1}
.mbar .t i{display:block;height:14px;border-radius:7px;background:var(--out)}
.mbar.in .t i{background:var(--in)}
.mbar b{min-width:92px;text-align:right;font-weight:600}
.mon button{color:var(--acc)}
.bal{background:var(--card);border:0;border-radius:14px;padding:18px;margin-top:10px}
.seg{background:rgba(118,118,128,.12)}
.seg button.on{background:#fff;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.add{box-shadow:0 4px 14px rgba(0,122,255,.35)}
.qh{margin:20px 4px 10px;font-weight:600}
.quick{display:flex;gap:10px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:10px 18px;font-size:15px;cursor:pointer}
.quick button.in{color:var(--in)}
.bk{display:flex;gap:10px}.bk button{flex:1;border:0;background:var(--card);color:var(--acc);border-radius:12px;padding:13px;font-size:16px;cursor:pointer}
.hint{color:var(--mute);font-size:12px;margin:8px 4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="seg tabs"><button id="tab1" class="on">明细</button><button id="tab2">数据</button></div>
  <div id="v1">
  <div class="mon"><button id="prev" aria-label="上个月">‹</button><b id="ym"></b><button id="next" aria-label="下个月">›</button></div>
  <div class="bal"><small>本月结余</small><div class="n" id="bal"></div>
    <div class="sub"><span>本月支出 <b id="so"></b></span><span>本月收入 <b id="si"></b></span></div></div>
  <div class="qh">快捷记账</div><div class="quick" id="quick"></div>
  <div id="list"></div>
  </div>
  <div id="v2" hidden>
    <div class="mon"><button id="yp" aria-label="上一年">‹</button><b id="yy"></b><button id="yn" aria-label="下一年">›</button></div>
    <div class="bal"><small>今年支出</small><div class="n" id="ye"></div>
      <div class="sub"><span>今年收入 <b id="yi"></b></span><span>今年结余 <b id="yb"></b></span></div></div>
    <div class="mh"><span>每月数据</span><div class="seg"><button id="m-out" class="on">支出</button><button id="m-in">收入</button></div></div>
    <div id="bars"></div>
    <div class="mh" style="margin-top:28px"><span>备份</span></div>
    <div class="bk"><button id="exp">导出备份</button><button id="imp">导入备份</button></div>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <p class="hint">数据只存在这台手机上。建议每月导出一次,换手机或误删时可以导入恢复。</p>
  </div>
</main>
<button class="add" id="open">记一笔</button>

<div class="mask" id="mask">
  <div class="sheet" role="dialog" aria-label="记一笔">
    <div class="seg"><button id="t-out" class="on">支出</button><button id="t-in">收入</button></div>
    <input id="amt" inputmode="decimal" placeholder="0.00" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="f"><input id="note" placeholder="备注(可不填)" maxlength="30"><input id="date" type="date"></div>
    <p id="err"></p>
    <button class="ok" id="save">保存</button>
  </div>
</div>

<script>
const CATS={out:["餐饮","交通","购物","居家","娱乐","医疗","其他"],in:["生活费","工资","奖金","红包","其他"]};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
let recs=[];try{recs=JSON.parse(localStorage.getItem("jz")||"[]")}catch(e){}
let col=null;const persist=()=>{if(col)return;try{localStorage.setItem("jz",JSON.stringify(recs))}catch(e){}};
let cur=today().slice(0,7),type="out",cat=CATS.out[0];

function render(){
  const [y,m]=cur.split("-");$("#ym").textContent=y+"年"+Number(m)+"月";
  const rs=recs.filter(r=>r.date.startsWith(cur));
  const so=rs.filter(r=>r.t=="out").reduce((a,r)=>a+r.amt,0);
  const si=rs.filter(r=>r.t=="in").reduce((a,r)=>a+r.amt,0);
  $("#bal").textContent=fmt(si-so);$("#so").textContent=fmt(so);$("#si").textContent=fmt(si);
  if(!rs.length){$("#list").innerHTML='<div class="empty">这个月还没有记录<br>点下方“记一笔”开始</div>';return}
  const days={};rs.forEach(r=>(days[r.date]=days[r.date]||[]).push(r));
  $("#list").innerHTML=Object.keys(days).sort().reverse().map(d=>{
    const items=days[d].sort((a,b)=>b.id-a.id);
    const net=items.reduce((a,r)=>a+(r.t=="in"?r.amt:-r.amt),0);
    return '<div class="day"><span>'+Number(d.slice(5,7))+"月"+Number(d.slice(8))+'日</span><span>'+fmt(net)+'</span></div>'+
    items.map(r=>'<div class="row"><div class="c">'+r.cat+(r.note?'<span>'+esc(r.note)+'</span>':'')+'</div><div class="a '+r.t+'">'+(r.t=="in"?"+":"-")+fmt(r.amt)+'</div><button class="x" data-id="'+r.id+'" aria-label="删除">×</button></div>').join("");
  }).join("");
}
function chips(){
  $("#chips").innerHTML=CATS[type].map(c=>'<button class="'+(c==cat?"on":"")+'">'+c+'</button>').join("");
}
function setType(t){type=t;cat=CATS[t][0];$("#t-out").classList.toggle("on",t=="out");$("#t-in").classList.toggle("on",t=="in");chips()}
function shift(n){const [y,m]=cur.split("-").map(Number);const d=new Date(y,m-1+n,1);cur=d.getFullYear()+"-"+pad(d.getMonth()+1);render()}

$("#prev").onclick=()=>shift(-1);$("#next").onclick=()=>shift(1);
$("#t-out").onclick=()=>setType("out");$("#t-in").onclick=()=>setType("in");
$("#chips").onclick=e=>{if(e.target.tagName=="BUTTON"){cat=e.target.textContent;chips()}};
function openSheet(t,c,n){setType(t);if(c){cat=c;chips()}$("#amt").value="";$("#note").value=n||"";$("#date").value=today();$("#err").textContent="";$("#mask").classList.add("on");setTimeout(()=>$("#amt").focus(),50)}
$("#open").onclick=()=>openSheet("out");
$("#mask").onclick=e=>{if(e.target.id=="mask")$("#mask").classList.remove("on")};
$("#save").onclick=()=>{
  const amt=parseFloat($("#amt").value);
  if(!(amt>0)){$("#err").textContent="请输入大于 0 的金额";return}
  const date=$("#date").value||today();
  const rec={id:Date.now(),t:type,amt:Math.round(amt*100)/100,cat,note:$("#note").value.trim(),date};recs.push(rec);if(col)col.doc(String(rec.id)).set(rec).catch(()=>{});
  persist();cur=date.slice(0,7);$("#mask").classList.remove("on");render();
};
$("#list").onclick=e=>{
  const id=e.target.dataset&&e.target.dataset.id;
  if(id&&confirm("删除这条记录?")){recs=recs.filter(r=>String(r.id)!==id);if(col)col.doc(id).delete().catch(()=>{});persist();render()}
};
let yr=Number(cur.slice(0,4)),mode="out";
function renderYear(){
  $("#yy").textContent=yr+"年";
  const rs=recs.filter(r=>r.date.startsWith(yr+"-"));
  const sum=(t,m)=>rs.filter(r=>r.t==t&&(!m||Number(r.date.slice(5,7))==m)).reduce((a,r)=>a+r.amt,0);
  const ye=sum("out"),yi=sum("in");
  $("#ye").textContent=fmt(ye);$("#yi").textContent=fmt(yi);$("#yb").textContent=fmt(yi-ye);
  const nowY=Number(today().slice(0,4)),last=yr==nowY?Number(today().slice(5,7)):12;
  const ms=[];for(let m=last;m>=1;m--)ms.push([m,sum(mode,m)]);
  const max=Math.max(1,...ms.map(x=>x[1]));
  $("#bars").innerHTML=ms.map(([m,v])=>'<div class="mbar '+mode+'" data-m="'+m+'"><span>'+m+'月</span><div class="t">'+(v>0?'<i style="width:'+Math.max(v/max*100,4)+'%"></i>':'')+'</div><b>¥'+fmt(v)+'</b></div>').join("");
}
function showTab(n){
  $("#v1").hidden=n!=1;$("#v2").hidden=n!=2;$("#open").style.display=n==1?"":"none";
  $("#tab1").classList.toggle("on",n==1);$("#tab2").classList.toggle("on",n==2);
  if(n==2){yr=Number(cur.slice(0,4));renderYear()}
}
$("#tab1").onclick=()=>showTab(1);$("#tab2").onclick=()=>showTab(2);
$("#yp").onclick=()=>{yr--;renderYear()};$("#yn").onclick=()=>{yr++;renderYear()};
$("#m-out").onclick=()=>{mode="out";$("#m-out").classList.add("on");$("#m-in").classList.remove("on");renderYear()};
$("#m-in").onclick=()=>{mode="in";$("#m-in").classList.add("on");$("#m-out").classList.remove("on");renderYear()};
$("#bars").onclick=e=>{const r=e.target.closest(".mbar");if(r){cur=yr+"-"+pad(Number(r.dataset.m));render();showTab(1)}};
const QUICK=[{n:"早餐",t:"out",c:"餐饮"},{n:"午餐",t:"out",c:"餐饮"},{n:"晚餐",t:"out",c:"餐饮"},{n:"公交",t:"out",c:"交通"},{n:"生活费",t:"in",c:"生活费"}];
$("#quick").innerHTML=QUICK.map((q,i)=>'<button class="'+q.t+'" data-i="'+i+'">'+(q.t=="in"?"+ ":"#")+q.n+'</button>').join("");
$("#quick").onclick=e=>{const b=e.target.closest("button");if(b){const q=QUICK[b.dataset.i];openSheet(q.t,q.c,q.n)}};
$("#exp").onclick=async()=>{
  const name="婧婧账本-"+today()+".json";
  const f=new File([JSON.stringify({app:"jzb",v:1,recs})],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;a.click();
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text()),list=Array.isArray(d)?d:d.recs;
    if(!Array.isArray(list))throw 0;
    const have=new Set(recs.map(r=>r.id));let n=0;
    list.forEach(r=>{if(r&&r.id&&r.amt>0&&r.date&&!have.has(r.id)){recs.push(r);n++}});
    persist();render();renderYear();alert("已导入 "+n+" 条记录");
  }catch(x){alert("这个文件不是有效的备份")}
  e.target.value="";
};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
chips();render();
</script>
</body>
</html>
